stages:
  - lint
  - license
  - test
  - build
  - publish

default:
  image: gradle:jdk21-alpine
  cache:
    key: "${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}-gradle-9.1.0"
    paths:
      # Cache only stable downloaded artifacts. Gradle's generated Kotlin DSL and
      # configuration cache state is not safe to restore across CI jobs.
      - .gradle/wrapper/
      - .gradle/caches/modules-2/
  # Keep Gradle state inside the project directory so selected caches can be reused across jobs.
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
    # The Docker image ships without execute permissions on scripts; fix this before running the wrapper.
    - chmod +x gradlew

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  CONTAINER_REGISTRY_URL: $CI_REGISTRY_IMAGE
  TAG: "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

lint:
  stage: lint
  dependencies: []
  script:
    - ./gradlew --no-daemon --stacktrace spotlessCheck checkstyleMain checkstyleTest
  artifacts:
    when: always
    paths:
      - build/reports/checkstyle/
      - build/reports/spotless/
    expire_in: 1 week

third-party-licenses:
  stage: license
  dependencies: []
  script:
    - ./gradlew --no-daemon --no-configuration-cache --stacktrace generateLicenseReport
  artifacts:
    when: always
    paths:
      - build/reports/dependency-license/
    expire_in: 1 week

test:
  stage: test
  needs: [ "lint", "third-party-licenses" ]
  dependencies: []
  script:
    - ./gradlew --no-daemon --stacktrace test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml
    paths:
      - build/reports/tests/
    expire_in: 1 week

build-jar:
  stage: build
  needs: [ "test" ]
  dependencies: []
  script:
    - ./gradlew --no-daemon clean bootJar
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never

publish-image:
  stage: publish
  image: docker:27
  services:
    - name: docker:27-dind
      command: [ "--tls=false" ]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TARGET_PLATFORMS: linux/amd64,linux/arm64
  needs: [ "build-jar" ]
  dependencies:
    - build-jar
  script:
    - TAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA:-${CI_COMMIT_REF_SLUG}}}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      docker run --privileged --rm tonistiigi/binfmt --install all
      docker buildx create --name zeta-multiarch --driver docker-container --use || docker buildx use zeta-multiarch
      docker buildx inspect --bootstrap
    - |
      EXTRA_TAG_ARGS=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        EXTRA_TAG_ARGS="-t ${CI_REGISTRY_IMAGE}:latest"
      fi
      docker buildx build \
        --platform "$TARGET_PLATFORMS" \
        -t "${CI_REGISTRY_IMAGE}:${TAG}" \
        $EXTRA_TAG_ARGS \
        --cache-from "type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache" \
        --cache-to "type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache,mode=max" \
        --push \
        .
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
