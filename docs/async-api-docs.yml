asyncapi: "3.1.0"
info:
  title: "testfachdienst AsyncAPI"
  version: 1.3.0
  x-generator: "springwolf"
defaultContentType: "application/json"
servers:
  ws:
    host: "wss://achelos_testfachdienst.de/ws"
    protocol: "stomp"
channels:
  _queue_erezept:
    address: "/queue/erezept"
    messages:
      ERezept:
        $ref: "#/components/messages/ERezept"
      ErezeptDeleteResponse:
        $ref: "#/components/messages/ErezeptDeleteResponse"
      ErezeptListResponse:
        $ref: "#/components/messages/ErezeptListResponse"
      WebSocketErrorResponse:
        $ref: "#/components/messages/WebSocketErrorResponse"
    bindings:
      stomp: {}
  _queue_hellozeta:
    address: "/queue/hellozeta"
    messages:
      HelloZetaResource:
        $ref: "#/components/messages/HelloZetaResource"
    bindings:
      stomp: {}
  erezept.create:
    address: "erezept.create"
    messages:
      ERezept:
        $ref: "#/components/messages/ERezept"
    bindings:
      stomp: {}
  erezept.delete._id_:
    address: "erezept.delete.{id}"
    messages:
      java.lang.Long:
        $ref: "#/components/messages/java.lang.Long"
    bindings:
      stomp: {}
  erezept.list:
    address: "erezept.list"
    messages:
      PayloadNotUsed:
        $ref: "#/components/messages/PayloadNotUsed"
    bindings:
      stomp: {}
  erezept.read._id_:
    address: "erezept.read.{id}"
    messages:
      java.lang.Long:
        $ref: "#/components/messages/java.lang.Long"
    bindings:
      stomp: {}
  erezept.update._id_:
    address: "erezept.update.{id}"
    messages:
      ERezept:
        $ref: "#/components/messages/ERezept"
    bindings:
      stomp: {}
  hellozeta:
    address: "hellozeta"
    messages:
      PayloadNotUsed:
        $ref: "#/components/messages/PayloadNotUsed"
    bindings:
      stomp: {}
components:
  schemas:
    ERezept:
      title: "Erezept"
      type: "object"
      properties:
        dosage:
          type: "string"
          description: "Dosage instructions"
          minLength: 1
          examples:
          - "1 tablet, 3× daily after meals"
        expiresAt:
          type: "string"
          description: "When it expires (ISO-8601)"
          format: "date-time"
          examples:
          - "2025-12-31T23:59:59Z"
        id:
          type: "integer"
          description: "Unique identifier"
          format: "int64"
          examples:
          - 123
        issuedAt:
          type: "string"
          description: "When it was issued (ISO-8601)"
          format: "date-time"
          examples:
          - "2025-09-22T10:30:00Z"
        medicationName:
          type: "string"
          description: "Medication name"
          minLength: 1
          examples:
          - "Ibuprofen 400 mg"
        patientId:
          type: "string"
          description: "FHIR/PKV patient identifier"
          minLength: 1
          examples:
          - "PAT-123456"
        practitionerId:
          type: "string"
          description: "Identifier of prescribing practitioner"
          minLength: 1
          examples:
          - "PRAC-98765"
        prescriptionId:
          type: "string"
          description: "Prescription identifier"
          minLength: 1
          examples:
          - "RX-2025-000123"
        status:
          type: "string"
          description: "Lifecycle states of a prescription"
          enum:
          - "CREATED"
          - "SIGNED"
          - "DISPENSED"
          - "CANCELLED"
          - "EXPIRED"
      description: "A prescription (ERezept)"
      examples:
      - dosage: "1 tablet, 3× daily after meals"
        expiresAt: "2025-12-31T23:59:59Z"
        id: 123
        issuedAt: "2025-09-22T10:30:00Z"
        medicationName: "Ibuprofen 400 mg"
        patientId: "PAT-123456"
        practitionerId: "PRAC-98765"
        prescriptionId: "RX-2025-000123"
        status: "CREATED"
      required:
      - "dosage"
      - "medicationName"
      - "patientId"
      - "practitionerId"
      - "prescriptionId"
    ErezeptDeleteResponse:
      title: "ErezeptDeleteResponse"
      type: "object"
      properties:
        id:
          type: "integer"
          description: "Identifier of the deleted E-Rezept"
          format: "int64"
          examples:
          - 42
        status:
          type: "string"
          description: "Deletion status"
          examples:
          - "deleted"
      description: "WebSocket response confirming that an E-Rezept was deleted"
      examples:
      - id: 42
        status: "deleted"
    ErezeptListResponse:
      title: "ErezeptListResponse"
      type: "object"
      properties:
        items:
          type: "array"
          description: "List of E-Rezepte"
          items:
            $ref: "#/components/schemas/ERezept"
      description: "WebSocket response containing all matching E-Rezepte"
      examples:
      - items:
        - dosage: "1 tablet, 3× daily after meals"
          expiresAt: "2025-12-31T23:59:59Z"
          id: 123
          issuedAt: "2025-09-22T10:30:00Z"
          medicationName: "Ibuprofen 400 mg"
          patientId: "PAT-123456"
          practitionerId: "PRAC-98765"
          prescriptionId: "RX-2025-000123"
          status: "CREATED"
    HelloZetaResource:
      title: "HelloZetaResource"
      type: "object"
      properties:
        message:
          type: "string"
          description: "Greeting text returned to the caller"
          examples:
          - "Hello ZETA!"
      description: "Simple greeting payload returned by Hello ZETA endpoints"
      examples:
      - message: "Hello ZETA!"
    PayloadNotUsed:
      title: "PayloadNotUsed"
      type: "object"
      properties: {}
      description: "No payload specified"
      examples:
      - {}
    SpringStompDefaultHeaders:
      title: "SpringStompDefaultHeaders"
      type: "object"
      properties: {}
      examples:
      - {}
    WebSocketErrorResponse:
      title: "WebSocketErrorResponse"
      type: "object"
      properties:
        details:
          type: "object"
          description: "Additional error details (optional)"
          examples:
          - errors:
              medicationName: "must not be blank"
          additionalProperties:
            type: "object"
            description: "Additional error details (optional)"
            examples:
            - errors:
                medicationName: "must not be blank"
        message:
          type: "string"
          description: "Human-readable error message"
          minLength: 1
          examples:
          - "ERezept not found for id=123"
        status:
          type: "integer"
          description: "HTTP status code"
          format: "int32"
          examples:
          - 404
        timestamp:
          type: "string"
          description: "Timestamp when error occurred"
          format: "date-time"
          minLength: 1
          examples:
          - "2025-10-21T14:30:00Z"
      description: "Error response for WebSocket operations"
      examples:
      - details:
          key: {}
        message: "ERezept not found for id=123"
        status: 404
        timestamp: "2025-10-21T14:30:00Z"
      required:
      - "message"
      - "status"
      - "timestamp"
    java.lang.Long:
      type: "integer"
      format: "int64"
      examples:
      - 0
  messages:
    ERezept:
      headers:
        $ref: "#/components/schemas/SpringStompDefaultHeaders"
      payload:
        schemaFormat: "application/vnd.aai.asyncapi+json;version=3.1.0"
        schema:
          $ref: "#/components/schemas/ERezept"
      name: "ERezept"
      title: "ERezept"
      bindings:
        stomp: {}
    ErezeptDeleteResponse:
      headers:
        $ref: "#/components/schemas/SpringStompDefaultHeaders"
      payload:
        schemaFormat: "application/vnd.aai.asyncapi+json;version=3.1.0"
        schema:
          $ref: "#/components/schemas/ErezeptDeleteResponse"
      name: "ErezeptDeleteResponse"
      title: "ErezeptDeleteResponse"
      bindings:
        stomp: {}
    ErezeptListResponse:
      headers:
        $ref: "#/components/schemas/SpringStompDefaultHeaders"
      payload:
        schemaFormat: "application/vnd.aai.asyncapi+json;version=3.1.0"
        schema:
          $ref: "#/components/schemas/ErezeptListResponse"
      name: "ErezeptListResponse"
      title: "ErezeptListResponse"
      bindings:
        stomp: {}
    HelloZetaResource:
      headers:
        $ref: "#/components/schemas/SpringStompDefaultHeaders"
      payload:
        schemaFormat: "application/vnd.aai.asyncapi+json;version=3.1.0"
        schema:
          $ref: "#/components/schemas/HelloZetaResource"
      name: "HelloZetaResource"
      title: "HelloZetaResource"
      bindings:
        stomp: {}
    PayloadNotUsed:
      headers:
        $ref: "#/components/schemas/SpringStompDefaultHeaders"
      payload:
        schemaFormat: "application/vnd.aai.asyncapi+json;version=3.1.0"
        schema:
          title: "PayloadNotUsed"
          type: "object"
          properties: {}
          description: "No payload specified"
      name: "PayloadNotUsed"
      title: "PayloadNotUsed"
      bindings:
        stomp: {}
    WebSocketErrorResponse:
      headers:
        $ref: "#/components/schemas/SpringStompDefaultHeaders"
      payload:
        schemaFormat: "application/vnd.aai.asyncapi+json;version=3.1.0"
        schema:
          $ref: "#/components/schemas/WebSocketErrorResponse"
      name: "WebSocketErrorResponse"
      title: "WebSocketErrorResponse"
      bindings:
        stomp: {}
    java.lang.Long:
      headers:
        $ref: "#/components/schemas/SpringStompDefaultHeaders"
      payload:
        schemaFormat: "application/vnd.aai.asyncapi+json;version=3.1.0"
        schema:
          type: "integer"
          format: "int64"
          examples:
          - 0
      name: "java.lang.Long"
      title: "long"
      bindings:
        stomp: {}
